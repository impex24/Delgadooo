<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Serena Delgado</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #000;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}

.page {
  max-width: 430px;
  margin: 0 auto;
  min-height: 100vh;
  background: #000;
  overflow: hidden;
}

.hero {
  position: relative;
  height: 590px;
  background: url("hero.png") center center / cover no-repeat;
}

.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0.05) 35%,
    rgba(0,0,0,0.35) 68%,
    rgba(0,0,0,1) 100%
  );
}

.hero-content {
  position: absolute;
  z-index: 2;
  bottom: 32px;
  left: 0;
  right: 0;
  text-align: center;
  padding: 0 12px;
}

.name {
  font-size: 44px;
  font-weight: 900;
  line-height: 1;
  letter-spacing: -1.5px;
  text-shadow: 0 4px 16px rgba(0,0,0,0.6);
}

.verified {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  margin-left: 5px;
  border-radius: 50%;
  background: #1da1f2;
  color: #fff;
  font-size: 17px;
  vertical-align: middle;
}

.online {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 13px;
  padding: 7px 18px;
  border-radius: 999px;
  background: #fff;
  color: #111;
  font-size: 18px;
  font-weight: 800;
  box-shadow: 0 4px 18px rgba(0,0,0,0.35);
}

.dot {
  width: 16px;
  height: 16px;
  background: #20d466;
  border-radius: 50%;
}

.content {
  padding: 0 15px 34px;
  margin-top: -4px;
}

.card {
  position: relative;
  display: block;
  height: 205px;
  border-radius: 32px;
  overflow: hidden;
  margin-bottom: 18px;
  border: 2px solid rgba(255,255,255,0.45);
  background: #111;
  text-decoration: none;
  color: #fff;
}

.card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  filter: brightness(0.58);
}

.card.blur img {
  filter: blur(10px) brightness(0.48);
  transform: scale(1.1);
}

.card-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0.05),
    rgba(0,0,0,0.45)
  );
}

.card-text {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
}

.card-text h2 {
  font-size: 34px;
  font-weight: 900;
  line-height: 1.1;
  margin-bottom: 7px;
  text-shadow: 0 3px 12px rgba(0,0,0,0.7);
}

.card-text p {
  font-size: 22px;
  font-weight: 500;
  opacity: 0.95;
  text-shadow: 0 3px 12px rgba(0,0,0,0.7);
}

.sensitive {
  background: rgba(0,0,0,0.82);
  padding: 14px 22px;
  border-radius: 14px;
  font-size: 21px;
  font-weight: 800;
  box-shadow: 0 6px 22px rgba(0,0,0,0.45);
}

.button {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 72px;
  padding: 0 16px 0 28px;
  margin-top: 16px;
  border-radius: 999px;
  text-decoration: none;
  font-size: 22px;
  font-weight: 900;
}

.button.green {
  background: #35f45a;
  color: #071107;
}

.button.dark {
  background: linear-gradient(180deg, #181818, #0b0b0b);
  color: #35f45a;
  border: 1px solid rgba(255,255,255,0.12);
}

.arrow {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: rgba(0,0,0,0.28);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
}

.footer {
  text-align: center;
  color: #777;
  font-size: 12px;
  padding: 28px 18px 10px;
}

@media (max-width: 390px) {
  .hero {
    height: 560px;
  }

  .name {
    font-size: 38px;
  }

  .verified {
    width: 23px;
    height: 23px;
    font-size: 15px;
  }

  .card {
    height: 190px;
  }

  .card-text h2 {
    font-size: 30px;
  }
}
</style>
</head>

<body>

<main class="page">

  <section class="hero">
    <div class="hero-content">
      <div class="name">
        Serena Delgado <span class="verified">✓</span>
      </div>

      <div class="online">
        <span class="dot"></span>
        Online
      </div>
    </div>
  </section>

  <section class="content">

    <a class="card" href="https://fanvue.com/serenadelgadooo">
      <img src="hero.png" alt="Serena Delgado">
      <div class="card-overlay"></div>
      <div class="card-text">
        <h2>All you need</h2>
        <p>You know ;)</p>
      </div>
    </a>

    <a class="card blur" href="https://fanvue.com/serenadelgadooo">
      <img src="hero.png" alt="Sensitive Content">
      <div class="card-overlay"></div>
      <div class="card-text">
        <div class="sensitive">🔒 Sensitive Content</div>
      </div>
    </a>

    <a class="button green" href="https://fanvue.com/serenadelgadooo">
      <span>Kostenlos folgen</span>
      <span class="arrow">→</span>
    </a>

    <a class="button dark" href="https://fanvue.com/serenadelgadooo">
      <span>VIP Access 🔥</span>
      <span class="arrow">→</span>
    </a>

    <div class="footer">
      © Serena Delgado
    </div>

  </section>

</main>

</body>
</html>
