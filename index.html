<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Serena Delgado</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
display:flex;
justify-content:center;
min-height:100vh;
overflow-x:hidden;
}

.wrapper{
width:100%;
max-width:500px;
background:#000;
}

.hero{
width:100%;
display:block;
}

.hero img{
width:100%;
display:block;
}

.card{
position:relative;
width:88%;
margin:-20px auto 25px;
border-radius:35px;
overflow:hidden;
border:2px solid rgba(255,255,255,.35);
cursor:pointer;
}

.card img{
width:100%;
display:block;
filter:blur(18px) brightness(.45);
transform:scale(1.08);
transition:.4s;
}

.card.unlocked img{
filter:brightness(.65);
transform:scale(1);
}

.overlay{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
}

.textbox{
background:rgba(0,0,0,.78);
padding:22px 34px;
border-radius:24px;
text-align:center;
backdrop-filter:blur(8px);
}

.textbox h2{
font-size:42px;
font-weight:900;
color:white;
}

.textbox p{
font-size:24px;
color:white;
margin-top:10px;
}

.join{
width:88%;
margin:0 auto;
cursor:pointer;
}

.join img{
width:100%;
display:block;
}

.footer{
text-align:center;
color:rgba(255,255,255,.35);
font-size:14px;
padding:20px 0 40px;
}

@media(max-width:480px){

.textbox h2{
font-size:32px;
}

.textbox p{
font-size:20px;
}

.card{
margin-top:-10px;
}

}
</style>
</head>

<body>

<div class="wrapper">

<div class="hero">
<img src="hero.png" alt="">
</div>

<div class="card" id="card">

<img src="button.png" alt="">

<div class="overlay">
<div class="textbox">
<h2 id="title">All you need</h2>
<p id="subtitle">You know ;)</p>
</div>
</div>

</div>

<div class="join" id="join">
<img src="button.png" alt="">
</div>

<div class="footer">
© Serena Delgado
</div>

</div>

<script>

const FANVUE_URL = "https://fanvue.com/DEINNAME";

let unlocked = false;

function openContent(){

if(!unlocked){

unlocked = true;

document.getElementById("card").classList.add("unlocked");

document.getElementById("title").innerText = "Tap again";
document.getElementById("subtitle").innerText = "Unlock content";

return;
}

window.location.href = FANVUE_URL;
}

document.getElementById("card").onclick = openContent;
document.getElementById("join").onclick = openContent;

</script>

</body>
</html>
