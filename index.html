<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serena Delgado</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    background:#000;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:#fff;
}

body{
    display:flex;
    justify-content:center;
}

.wrapper{
    width:100%;
    max-width:430px;
    background:#000;
}

.hero{
    width:100%;
}

.hero img{
    width:100%;
    display:block;
}

.content{
    padding:14px;
    margin-top:-10px;
}

.card{
    position:relative;
    width:100%;
    height:250px;
    overflow:hidden;
    border-radius:34px;
    cursor:pointer;
    border:2px solid rgba(255,255,255,.25);
}

.card img{
    width:100%;
    height:100%;
    object-fit:cover;
    filter:blur(20px) brightness(.45);
    transform:scale(1.18);
}

.overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
}

.textbox{
    text-align:center;
}

.textbox h2{
    font-size:56px;
    line-height:1;
    font-weight:900;
    color:#fff;
    text-shadow:0 4px 20px rgba(0,0,0,.7);
}

.textbox p{
    margin-top:10px;
    font-size:24px;
    color:#fff;
    text-shadow:0 4px 20px rgba(0,0,0,.7);
}

.footer{
    text-align:center;
    padding:24px 0 30px;
    color:rgba(255,255,255,.4);
    font-size:13px;
}

@media(max-width:430px){

    .content{
        padding:12px;
    }

    .card{
        height:220px;
    }

    .textbox h2{
        font-size:48px;
    }

    .textbox p{
        font-size:22px;
    }
}
</style>
</head>

<body>

<div class="wrapper">

    <!-- HERO -->
    <div class="hero">
        <img src="hero.png" alt="">
    </div>

    <!-- BLUR CARD -->
    <div class="content">

        <div class="card" onclick="openFanvue()">

            <img src="button.png" alt="">

            <div class="overlay">
                <div class="textbox">
                    <h2>All you need</h2>
                    <p>You know ;)</p>
                </div>
            </div>

        </div>

        <div class="footer">
            © Serena Delgado
        </div>

    </div>

</div>

<script>
function openFanvue(){
    window.location.href = "https://fanvue.com/serenadelgadooo";
}
</script>

</body>
</html>
