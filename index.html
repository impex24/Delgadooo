<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serena Delgado</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
  display:flex;
  justify-content:center;
  min-height:100vh;
}

.wrapper{
  width:100%;
  max-width:430px;
  background:#000;
  min-height:100vh;
  overflow:hidden;
}

.hero img{
  width:100%;
  display:block;
}

.content{
  padding:18px 14px 34px;
}

.card{
  position:relative;
  display:block;
  width:100%;
  height:230px;
  overflow:hidden;
  border-radius:34px;
  border:2px solid rgba(255,255,255,.28);
  cursor:pointer;
  text-decoration:none;
  color:#fff;
  animation:pulse 1.8s infinite;
}

.card img{
  width:100%;
  height:100%;
  object-fit:cover;
  filter:blur(16px) brightness(.55);
  transform:scale(1.14);
  transition:.35s ease;
}

.card.revealed img{
  filter:brightness(.62);
  transform:scale(1.03);
}

.overlay{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.textbox h2{
  font-size:50px;
  line-height:1;
  font-weight:900;
  text-shadow:0 5px 22px rgba(0,0,0,.8);
}

.textbox p{
  margin-top:10px;
  font-size:23px;
  text-shadow:0 5px 22px rgba(0,0,0,.8);
}

.footer{
  text-align:center;
  padding:24px 0 10px;
  color:rgba(255,255,255,.38);
  font-size:13px;
}

.browser-warning{
  position:fixed;
  inset:0;
  z-index:9999;
  background:rgba(0,0,0,.92);
  display:none;
  align-items:center;
  justify-content:center;
  padding:24px;
  text-align:center;
}

.browser-box{
  max-width:380px;
  background:#111;
  border:1px solid rgba(255,255,255,.18);
  border-radius:24px;
  padding:28px 22px;
}

.browser-box h2{
  font-size:26px;
  margin-bottom:12px;
}

.browser-box p{
  font-size:17px;
  line-height:1.45;
  color:#ddd;
}

.browser-box button{
  margin-top:22px;
  width:100%;
  height:52px;
  border:none;
  border-radius:999px;
  background:#35f45a;
  color:#000;
  font-size:18px;
  font-weight:900;
}

@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.025);box-shadow:0 0 28px rgba(255,255,255,.16)}
  100%{transform:scale(1)}
}

@media(max-width:430px){
  .card{height:220px}
  .textbox h2{font-size:46px}
  .textbox p{font-size:22px}
}
</style>
</head>

<body>

<div class="wrapper">

  <div class="hero">
    <img src="hero.png" alt="Serena Delgado">
  </div>

  <div class="content">

    <a class="card" id="unlockCard" href="https://fanvue.com/serenadelgadooo">
      <img src="button.png" alt="Preview">

      <div class="overlay">
        <div class="textbox">
          <h2 id="title">All you need</h2>
          <p id="subtitle">You know ;)</p>
        </div>
      </div>
    </a>

    <div class="footer">© Serena Delgado</div>

  </div>
</div>

<div class="browser-warning" id="browserWarning">
  <div class="browser-box">
    <h2>Im Browser öffnen</h2>
    <p>
      TikTok oder Instagram blockieren externe Seiten manchmal.
      Tippe oben rechts auf die drei Punkte und wähle
      <b>„Im Browser öffnen“</b>, um fortzufahren.
    </p>
    <button onclick="closeWarning()">Okay</button>
  </div>
</div>

<script>
let revealed = false;

function isInAppBrowser(){
  const ua = navigator.userAgent.toLowerCase();
  return ua.includes("tiktok") ||
         ua.includes("instagram") ||
         ua.includes("fbav") ||
         ua.includes("fban");
}

document.getElementById("unlockCard").addEventListener("click", function(e){

  if(isInAppBrowser()){
    e.preventDefault();
    document.getElementById("browserWarning").style.display = "flex";
    return;
  }

  if(!revealed){
    e.preventDefault();
    revealed = true;
    this.classList.add("revealed");
    document.getElementById("title").innerText = "Tap again";
    document.getElementById("subtitle").innerText = "Unlock content";
    return;
  }

});

function closeWarning(){
  document.getElementById("browserWarning").style.display = "none";
}
</script>

</body>
</html>
