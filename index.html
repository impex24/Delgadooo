<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Serena Delgado</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}
.page{
  max-width:430px;
  margin:0 auto;
  min-height:100vh;
  background:#000;
  overflow:hidden;
}
.hero{
  position:relative;
  height:610px;
  background:url("hero.png.jpeg") center center/cover no-repeat;
}
.hero:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,0) 42%,rgba(0,0,0,.65) 78%,#000 100%);
}
.profile{
  position:absolute;
  z-index:2;
  left:0;
  right:0;
  bottom:34px;
  text-align:center;
  padding:0 12px;
}
.name{
  font-size:46px;
  font-weight:900;
  line-height:1;
  letter-spacing:-1.4px;
  text-shadow:0 5px 18px rgba(0,0,0,.75);
}
.verified{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:27px;
  height:27px;
  margin-left:5px;
  border-radius:50%;
  background:#1da1f2;
  color:#fff;
  font-size:17px;
  vertical-align:middle;
}
.online{
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-top:14px;
  background:#fff;
  color:#111;
  padding:7px 19px;
  border-radius:999px;
  font-size:18px;
  font-weight:800;
}
.dot{
  width:16px;
  height:16px;
  border-radius:50%;
  background:#20d466;
}
.content{
  padding:0 16px 38px;
  margin-top:-2px;
}
.unlock-card{
  position:relative;
  height:230px;
  border-radius:34px;
  overflow:hidden;
  border:2px solid rgba(255,255,255,.45);
  background:#111;
  cursor:pointer;
  user-select:none;
}
.unlock-card img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  filter:blur(10px) brightness(.45);
  transform:scale(1.1);
  transition:.35s ease;
}
.unlock-card.active img{
  filter:brightness(.55);
  transform:scale(1);
}
.card-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,.05),rgba(0,0,0,.55));
}
.card-text{
  position:absolute;
  inset:0;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}
.lock-box{
  background:rgba(0,0,0,.82);
  padding:15px 24px;
  border-radius:15px;
  font-size:22px;
  font-weight:900;
  box-shadow:0 8px 25px rgba(0,0,0,.45);
}
.hint{
  margin-top:14px;
  font-size:18px;
  opacity:.9;
}
.cta{
  margin-top:18px;
  height:74px;
  border-radius:999px;
  background:#35f45a;
  color:#061006;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px 0 28px;
  font-size:22px;
  font-weight:900;
  box-shadow:0 10px 28px rgba(53,244,90,.18);
}
.arrow{
  width:46px;
  height:46px;
  border-radius:50%;
  background:rgba(0,0,0,.28);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
}
.footer{
  text-align:center;
  color:#777;
  font-size:12px;
  padding:28px 0 0;
}
@media(max-width:390px){
  .hero{height:570px}
  .name{font-size:39px}
  .unlock-card{height:210px}
}
</style>
</head>

<body>

<main class="page">

  <section class="hero">
    <div class="profile">
      <div class="name">
        Serena Delgado <span class="verified">✓</span>
      </div>
      <div class="online">
        <span class="dot"></span> Online
      </div>
    </div>
  </section>

  <section class="content">

    <div class="unlock-card" id="unlockCard">
      <img src="hero.png.jpeg" alt="Serena Delgado">
      <div class="card-overlay"></div>

      <div class="card-text">
        <div class="lock-box" id="lockText">🔒 Sensitive Content</div>
        <div class="hint" id="hintText">Tap to preview</div>
      </div>
    </div>

    <div class="cta" id="ctaButton">
      <span id="ctaText">Preview freischalten</span>
      <span class="arrow">→</span>
    </div>

    <div class="footer">© Serena Delgado</div>

  </section>

</main>

<script>
const fanvueLink = "https://fanvue.com/serenadelgadooo";
let unlocked = false;

function handleClick() {
  if (!unlocked) {
    unlocked = true;
    document.getElementById("unlockCard").classList.add("active");
    document.getElementById("lockText").innerHTML = "All you need";
    document.getElementById("hintText").innerHTML = "You know ;)";
    document.getElementById("ctaText").innerHTML = "Jetzt beitreten";
  } else {
    window.location.href = fanvueLink;
  }
}

document.getElementById("unlockCard").addEventListener("click", handleClick);
document.getElementById("ctaButton").addEventListener("click", handleClick);
</script>

</body>
</html>
