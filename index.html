<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Serena Delgado</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.page{
  width:100%;
  max-width:430px;
  margin:0 auto;
  background:#000;
  min-height:100vh;
  overflow:hidden;
}

.hero{
  height:78vh;
  min-height:610px;
  max-height:760px;
  background-image:url("hero.png.jpeg");
  background-size:cover;
  background-position:center center;
  background-repeat:no-repeat;
  position:relative;
}

.hero::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:180px;
  background:linear-gradient(to bottom,rgba(0,0,0,0),#000);
}

.content{
  position:relative;
  z-index:2;
  margin-top:-38px;
  padding:0 16px 40px;
  background:#000;
}

.preview-card{
  position:relative;
  width:100%;
  height:235px;
  border-radius:34px;
  overflow:hidden;
  border:2px solid rgba(255,255,255,.55);
  background:#111;
  cursor:pointer;
  box-shadow:0 0 26px rgba(255,255,255,.08);
}

.preview-card img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  filter:blur(16px) brightness(.45);
  transform:scale(1.14);
  transition:.35s ease;
}

.preview-card.active img{
  filter:brightness(.55);
  transform:scale(1.03);
}

.preview-overlay{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:rgba(0,0,0,.18);
}

.preview-box{
  background:rgba(0,0,0,.76);
  padding:20px 34px;
  border-radius:24px;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.preview-box h2{
  font-size:38px;
  font-weight:900;
  line-height:1;
  margin-bottom:12px;
}

.preview-box p{
  font-size:25px;
  font-weight:500;
}

.join-btn{
  width:100%;
  height:82px;
  margin-top:26px;
  border-radius:999px;
  background:#35f45a;
  color:#061006;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px 0 32px;
  font-size:28px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 0 36px rgba(53,244,90,.38);
}

.arrow{
  width:54px;
  height:54px;
  border-radius:50%;
  background:rgba(0,0,0,.28);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  font-weight:900;
}

.footer{
  text-align:center;
  color:rgba(255,255,255,.35);
  font-size:15px;
  padding:32px 0 0;
}

@media(max-width:390px){
  .hero{
    height:76vh;
    min-height:560px;
  }

  .content{
    margin-top:-30px;
    padding:0 14px 36px;
  }

  .preview-card{
    height:215px;
  }

  .preview-box h2{
    font-size:32px;
  }

  .preview-box p{
    font-size:22px;
  }

  .join-btn{
    height:74px;
    font-size:24px;
  }
}
</style>
</head>

<body>

<main class="page">

  <section class="hero"></section>

  <section class="content">

    <div class="preview-card" id="previewCard">
      <img src="hero.png.jpeg" alt="Serena Delgado">
      <div class="preview-overlay">
        <div class="preview-box">
          <h2 id="previewTitle">All you need</h2>
          <p id="previewSub">You know ;)</p>
        </div>
      </div>
    </div>

    <div class="join-btn" id="joinButton">
      <span id="buttonText">Jetzt beitreten</span>
      <span class="arrow">→</span>
    </div>

    <div class="footer">© Serena Delgado</div>

  </section>

</main>

<script>
const fanvueLink = "https://fanvue.com/serenadelgadooo";
let unlocked = false;

function handleClick(){
  if(!unlocked){
    unlocked = true;
    document.getElementById("previewCard").classList.add("active");
    document.getElementById("previewTitle").innerText = "Tap again";
    document.getElementById("previewSub").innerText = "Unlock full gallery";
    document.getElementById("buttonText").innerText = "Continue";
  }else{
    window.location.href = fanvueLink;
  }
}

document.getElementById("previewCard").addEventListener("click", handleClick);
document.getElementById("joinButton").addEventListener("click", handleClick);
</script>

</body>
</html>
