<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serena Delgado</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
  background:#000;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:#fff;
}

body{
  display:flex;
  justify-content:center;
  min-height:100vh;
}

.wrapper{
  width:100%;
  max-width:430px;
  background:#000;
  min-height:100vh;
  overflow:hidden;
}

.hero img{
  width:100%;
  display:block;
}

.content{
  padding:18px 14px 34px;
}

.card{
  position:relative;
  width:100%;
  height:230px;
  overflow:hidden;
  border-radius:34px;
  border:2px solid rgba(255,255,255,.28);
  cursor:pointer;
  animation:pulse 1.8s infinite;
}

.card img{
  width:100%;
  height:100%;
  object-fit:cover;
  filter:blur(16px) brightness(.55);
  transform:scale(1.14);
  transition:.35s ease;
}

.card.revealed img{
  filter:brightness(.62);
  transform:scale(1.03);
}

.overlay{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.textbox h2{
  font-size:50px;
  line-height:1;
  font-weight:900;
  text-shadow:0 5px 22px rgba(0,0,0,.8);
}

.textbox p{
  margin-top:10px;
  font-size:23px;
  text-shadow:0 5px 22px rgba(0,0,0,.8);
}

.footer{
  text-align:center;
  padding:24px 0 10px;
  color:rgba(255,255,255,.38);
  font-size:13px;
}

.browser-warning{
  position:fixed;
  inset:0;
  z-index:9999;
  background:#fff;
  color:#111;
  display:none;
  align-items:center;
  justify-content:center;
  padding:28px;
  text-align:center;
}

.browser-box{
  max-width:390px;
}

.browser-box .icon{
  font-size:54px;
  margin-bottom:18px;
}

.browser-box h2{
  font-size:30px;
  line-height:1.15;
  margin-bottom:16px;
}

.browser-box p{
  font-size:19px;
  line-height:1.45;
  color:#333;
  margin-bottom:18px;
}

.steps{
  text-align:left;
  background:#f4f4f4;
  border-radius:18px;
  padding:18px;
  font-size:17px;
  line-height:1.55;
  margin-top:18px;
}

.copy-btn{
  margin-top:22px;
  width:100%;
  height:54px;
  border:none;
  border-radius:999px;
  background:#ff2b5f;
  color:#fff;
  font-size:18px;
  font-weight:900;
}

@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.025);box-shadow:0 0 28px rgba(255,255,255,.16)}
  100%{transform:scale(1)}
}

@media(max-width:430px){
  .card{height:220px}
  .textbox h2{font-size:46px}
  .textbox p{font-size:22px}
}
</style>
</head>

<body>

<div class="wrapper">

  <div class="hero">
    <img src="hero.png" alt="Serena Delgado">
  </div>

  <div class="content">

    <div class="card" id="unlockCard">
      <img src="button.png" alt="Preview">

      <div class="overlay">
        <div class="textbox">
          <h2 id="title">All you need</h2>
          <p id="subtitle">You know ;)</p>
        </div>
      </div>
    </div>

    <div class="footer">© Serena Delgado</div>

  </div>
</div>

<div class="browser-warning" id="browserWarning">
  <div class="browser-box">
    <div class="icon">↗️</div>
    <h2>Bitte in Safari öffnen</h2>
    <p>
      TikTok blockiert externe Seiten manchmal.  
      Öffne diese Seite im normalen Browser, damit alles funktioniert.
    </p>

    <div class="steps">
      1. Oben rechts auf <b>•••</b> tippen<br>
      2. <b>„Im Browser öffnen“</b> wählen<br>
      3. Falls das nicht geht: Link kopieren und in Safari öffnen
    </div>

    <button class="copy-btn" onclick="copyLink()">Link kopieren</button>
  </div>
</div>

<script>
const FANVUE_URL = "https://fanvue.com/serenadelgadooo";
const PAGE_URL = "https://serenadelgadooo.com";
let revealed = false;

function isInAppBrowser(){
  const ua = navigator.userAgent.toLowerCase();
  return ua.includes("tiktok") ||
         ua.includes("instagram") ||
         ua.includes("fbav") ||
         ua.includes("fban") ||
         ua.includes("musical_ly") ||
         ua.includes("bytedance");
}

function showBrowserWarning(){
  document.getElementById("browserWarning").style.display = "flex";
}

document.getElementById("unlockCard").addEventListener("click", function(){

  if(isInAppBrowser()){
    showBrowserWarning();
    return;
  }

  if(!revealed){
    revealed = true;
    this.classList.add("revealed");
    document.getElementById("title").innerText = "Tap again";
    document.getElementById("subtitle").innerText = "Unlock content";
    return;
  }

  window.location.href = FANVUE_URL;
});

function copyLink(){
  navigator.clipboard.writeText(PAGE_URL);
  alert("Link kopiert. Jetzt in Safari einfügen.");
}
</script>

</body>
</html>
