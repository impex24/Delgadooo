<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Serena Delgado</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  background: #000;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}

body {
  min-height: 100vh;
}

.page {
  max-width: 430px;
  margin: 0 auto;
  background: #000;
  min-height: 100vh;
  overflow: hidden;
}

.hero {
  width: 100%;
  background: #000;
}

.hero img {
  width: 100%;
  display: block;
}

.content {
  padding: 18px 16px 38px;
  background: #000;
}

.preview-card {
  position: relative;
  width: 100%;
  height: 235px;
  border-radius: 34px;
  overflow: hidden;
  border: 2px solid rgba(255,255,255,0.45);
  background: #111;
  cursor: pointer;
  user-select: none;
}

.preview-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  filter: blur(14px) brightness(0.48);
  transform: scale(1.12);
  transition: all 0.35s ease;
}

.preview-card.active img {
  filter: brightness(0.58);
  transform: scale(1);
}

.preview-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0.08),
    rgba(0,0,0,0.48)
  );
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
}

.preview-box {
  background: rgba(0,0,0,0.72);
  padding: 18px 28px;
  border-radius: 22px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.preview-box h2 {
  font-size: 34px;
  font-weight: 900;
  line-height: 1.05;
  margin-bottom: 10px;
  text-shadow: 0 3px 12px rgba(0,0,0,0.65);
}

.preview-box p {
  font-size: 23px;
  font-weight: 500;
  opacity: 0.95;
}

.join-btn {
  width: 100%;
  height: 76px;
  margin-top: 26px;
  border-radius: 999px;
  background: #35f45a;
  color: #061006;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 17px 0 30px;
  font-size: 25px;
  font-weight: 900;
  text-decoration: none;
  box-shadow: 0 0 35px rgba(53,244,90,0.35);
  cursor: pointer;
  user-select: none;
}

.arrow {
  width: 49px;
  height: 49px;
  border-radius: 50%;
  background: rgba(0,0,0,0.28);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  font-weight: 900;
}

.footer {
  text-align: center;
  color: rgba(255,255,255,0.38);
  font-size: 15px;
  padding: 32px 0 10px;
}

@media (max-width: 390px) {
  .content {
    padding: 16px 14px 34px;
  }

  .preview-card {
    height: 215px;
    border-radius: 30px;
  }

  .preview-box h2 {
    font-size: 30px;
  }

  .preview-box p {
    font-size: 21px;
  }

  .join-btn {
    height: 70px;
    font-size: 22px;
  }
}
</style>
</head>

<body>

<main class="page">

  <section class="hero">
    <img src="hero.png.jpeg" alt="Serena Delgado">
  </section>

  <section class="content">

    <div class="preview-card" id="previewCard">
      <img src="hero.png.jpeg" alt="Preview">
      <div class="preview-overlay">
        <div class="preview-box">
          <h2 id="previewTitle">All you need</h2>
          <p id="previewSub">You know ;)</p>
        </div>
      </div>
    </div>

    <div class="join-btn" id="joinButton">
      <span id="buttonText">Jetzt beitreten</span>
      <span class="arrow">→</span>
    </div>

    <div class="footer">
      © Serena Delgado
    </div>

  </section>

</main>

<script>
const fanvueLink = "https://fanvue.com/serenadelgadooo";
let unlocked = false;

function goNext() {
  if (!unlocked) {
    unlocked = true;

    document.getElementById("previewCard").classList.add("active");
    document.getElementById("previewTitle").innerText = "Tap again";
    document.getElementById("previewSub").innerText = "Unlock full gallery";
    document.getElementById("buttonText").innerText = "Continue to VIP";
  } else {
    window.location.href = fanvueLink;
  }
}

document.getElementById("previewCard").addEventListener("click", goNext);
document.getElementById("joinButton").addEventListener("click", goNext);
</script>

</body>
</html>
